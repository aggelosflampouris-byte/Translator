name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "9.1.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Release Keystore (when provided via Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p signing
            echo "$KEYSTORE_BASE64" | base64 --decode > signing/release.keystore
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon || (sleep 5 && ./gradlew assembleRelease --no-daemon)

      - name: Prepare Release Artifact
        run: |
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release-signed.apk
          cd app/build/outputs/apk/release
          sha256sum app-release-signed.apk | awk '{print $1}' > app-release-signed.apk.sha256

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} --title "Release ${{ github.ref_name }}" --generate-notes || true
          gh release upload ${{ github.ref_name }} app/build/outputs/apk/release/app-release-signed.apk app/build/outputs/apk/release/app-release-signed.apk.sha256 --clobber
